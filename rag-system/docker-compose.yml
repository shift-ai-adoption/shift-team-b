services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragdb
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [ragnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: rag-chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks: [ragnet]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [ragnet]

  backend:
    build: ./backend
    container_name: rag-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:ragpass@pgvector:5432/ragdb
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BASIC_AUTH_USER: admin
      BASIC_AUTH_PASS: admin123!
      EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
      LLM_MODEL_ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    volumes:
      - upload_data:/data/uploads
    ports:
      - "8001:8000"          # Backend API (external, SG 8000-8002 permitted, 8001 free)
    depends_on:
      pgvector:
        condition: service_healthy
      chromadb:
        condition: service_started
      qdrant:
        condition: service_started
    networks: [ragnet]

  frontend:
    build: ./frontend
    container_name: rag-frontend
    ports:
      - "8081:80"            # WEBUI (external, SG-permitted & free)
    depends_on:
      - backend
    networks: [ragnet]

networks:
  ragnet:
    driver: bridge

volumes:
  pgvector_data:
  chroma_data:
  qdrant_data:
  upload_data:
